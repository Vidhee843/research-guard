<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Guard</title>
    <link rel="stylesheet" href="css/publications.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body onload="fillFields()">
    <div class="publications-container">
        <h1 class="page-title">Publications</h1>
        <div class="main-content">
            <div class="content-header">
                <h2 class="section-title">Submit Publication</h2>
            </div>
            <form id="publication-form" class="publication-form">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" maxlength="255" required>

                <label for="abstract">Abstract:</label>
                <textarea id="abstract" name="abstract" rows="5"></textarea>

                <label for="url">URL:</label>
                <input type="url" id="url" name="url" maxlength="255" required>

                <label for="authors">Authors</label>
                <textarea id="authors" name="authors" placeholder='Author 1, Author 2' required></textarea>

                <label for="submissio-_date">Submission Date:</label>
                <input type="datetime-local" id="submission-date" name="submission-date">

                <label for="category">Category:</label>
                <input type="text" id="category" name="category" maxlength="255" required>

                <label for="metadata">Metadata:</label>
                <textarea id="metadata" name="metadata" placeholder='{"key": "value"}'></textarea>
                <div class="form-buttons">
                    <button style="background-color: #00C896;" type="submit" class="btn submit-btn">Submit</button>
                </div>
            </form>
        </div>

        <div class="action-buttons">
            <button onclick="redirectBack();" style="background-color: #1F6FEB;" class="btn">← Back</button>
        </div>
    </div>
</body>
<footer>
    <script src="js/publications.js"></script>
</footer>
</html>
